<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c61"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>アルコール検知器チェック表</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172f44;font:17px/1.6 system-ui,sans-serif}header{background:#123c61;color:white;padding:22px max(20px,calc((100% - 860px)/2))}h1{font-size:24px;margin:0}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #cbd8e4;border-radius:12px;padding:20px;margin-bottom:18px}h2{margin:0 0 14px;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600}input,select,button{font:inherit;min-height:48px;border:1px solid #a9becf;border-radius:7px;padding:8px;width:100%;background:white;color:inherit}button{cursor:pointer;font-weight:700}.primary{background:#123c61;color:white;border-color:#123c61}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:8px 2px;font-size:15px;min-height:65px}.day small{display:block;font-size:12px}.rest{background:#fff0f0;color:#b32424;border-color:#d06e6e}.private{background:#e9f1ff;color:#164f9c;border-color:#729bca}.week{text-align:center;font-size:14px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar button[aria-pressed=true]{background:#123c61;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:14px;color:#526679;margin:8px 0}#summary{font-weight:600}#preview{width:100%;height:auto;border:1px solid #cbd8e4}details summary{cursor:pointer;font-weight:700}#status{white-space:pre-wrap}input[type=checkbox]{width:22px;min-height:22px;vertical-align:middle} @media(max-width:500px){main{padding:12px}section{padding:14px}.fields{grid-template-columns:1fr}.toolbar button{font-size:15px;padding:6px}.actions{grid-template-columns:1fr}}</style><header><h1>アルコール検知器チェック表</h1></header><main><section><div class="fields"><label>対象年月<input id="month" type="month"></label><label>組合番号<input id="number" inputmode="numeric" placeholder="例：134"></label><label>事業者名<input id="name" autocomplete="name" placeholder="氏名"></label><label>組合のメールアドレス<input id="email" type="email" placeholder="初回に入力してください"></label></div><p class="hint">入力内容はこの端末に保存されます。毎月、翌月10日までに提出してください。</p></section><section><h2>休車・自家使用の日を指定</h2><p class="hint">指定しない日は営業日です。下の種類を選んで日付を押してください。</p><div class="toolbar"><button data-mode="rest" aria-pressed="true">休車</button><button data-mode="private" aria-pressed="false">自家使用</button><button data-mode="business" aria-pressed="false">営業に戻す</button></div><div id="calendar" class="calendar"></div><p id="summary"></p></section><section><label><input type="checkbox" id="confirmed"> 実際の検知器使用・検知結果と一致することを確認しました</label><p class="hint">営業日・自家使用日は「使用：有／酒気帯び：無」で作成します。実際の記録が異なる場合、この表では提出せず組合へご相談ください。</p><div class="actions"><button id="download" class="primary">PDFを保存</button><button id="share" class="primary">PDFを保存してメールを開く</button><button id="mail">宛先入りメールを開く</button><button id="shareFileManualTo">PDF添付で共有（宛先は手入力）</button></div><p id="status" role="status" aria-live="polite"></p><p class="hint">PDFを保存した後、宛先が入力されたメールを開きます。PDFは自動添付されませんので、保存したPDFを添付して送信してください。</p></section><section><details><summary>提出用チェック表を確認</summary><canvas id="preview" width="1240" height="1754"></canvas></details></section><p class="hint">ホーム画面へ追加して使えます。最初に開いた後はオフラインでも入力・PDF作成ができます。</p></main><script src="app.js"></script><script src="mail-fix.js"></script></html>
